<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="%sveltekit.assets%/brand/gx-emblem.svg" />
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/unbounded-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Тема ставится до первой отрисовки: иначе тёмный интерфейс мигает
      // светлым на каждой загрузке.
      try {
        const stored = document.cookie.match(/(?:^|; )theme=(light|dark)/);
        if (stored) document.documentElement.dataset.theme = stored[1];
      } catch (error) {
        /* cookie недоступны — остаётся тёмная по умолчанию */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
