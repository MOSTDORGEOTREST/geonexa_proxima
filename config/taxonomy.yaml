      - structural health monitoring
      - deformation monitoring
      - instrumentation
      - геотехнический мониторинг
      - мониторинг деформаций
    subtopics:
      - inclinometers and extensometers
      - piezometers and pore pressure
      - distributed fiber optic sensing
      - GNSS and total stations
      - sensor fusion
      - anomaly and change detection
      - early warning systems

  - id: geophysics
    name: Инженерная и прикладная геофизика
    weight: 0.9
    description: Неинвазивное исследование строения и динамики геологической среды.
    terms:
