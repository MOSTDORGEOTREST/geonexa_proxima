version: 1
language: ru

profile:
  name: "GeoNexa Proxima — геотехнологический исследовательский профиль"
  mission: >-
    Находить научно сильные и практически применимые методы на пересечении
    геотехники, инженерной геологии, геофизики, дистанционного зондирования и AI,
    которые можно перенести в мониторинг, моделирование и управление рисками.
  content_languages: [ru, en]
  preferred_item_kinds: [paper, method, software, dataset]
  positive_signals:
    - открытый код или воспроизводимый pipeline
    - доступный датасет и прозрачный протокол валидации
    - проверка на натурных или промышленных данных
    - оценка неопределённости и физическая интерпретируемость
    - сравнение с сильными baseline-методами
    - переносимость между площадками, регионами и сенсорами
  negative_signals:
    - только синтетические результаты без проверки переноса
    - отсутствие описания данных или метрик
    - утечка данных между train и test
    - неподтверждённые маркетинговые заявления
    - чисто отраслевые новости без метода, данных или инженерного результата

# High-recall discovery uses several intersections instead of one vague
# "geotechnical AI" query. Semantic filtering and reranking happen later.
discovery_queries:
  - '("soil liquefaction" AND "neural operator")'
  - '("geotechnical engineering" AND "foundation model")'
  - '("soil mechanics" AND "graph neural network")'
  - '("constitutive model" AND "machine learning")'
  - '("discrete element method" AND "differentiable simulation")'
  - '("finite element method" AND "surrogate model")'
  - '("cyclic loading" AND "state space model")'
  - '("soil-structure interaction" AND "physics-informed")'
  - '("geomechanics" AND "neural ODE")'
  - '("slope stability" AND "uncertainty quantification")'
  - '("geotechnical monitoring" AND "self-supervised learning")'
  - '("poromechanics" AND "operator learning")'

domains:
  - id: geotechnical_engineering
    name: Геотехника и механика грунтов
    weight: 1.0
    description: Поведение грунтов, оснований и геотехнических сооружений.
    terms:
      - geotechnical engineering
      - soil mechanics
      - rock mechanics
      - механика грунтов
      - механика горных пород
      - основания и фундаменты
    subtopics:
      - foundations and piles
      - slopes and landslides
      - retaining structures and excavations
      - tunnels and underground construction
      - constitutive modelling
      - soil-structure interaction
      - settlement and deformation
      - liquefaction and seismic response

  - id: engineering_geology
    name: Инженерная геология и геориски
    weight: 0.95
    description: Свойства геологической среды, опасные процессы и устойчивость территорий.
    terms:
      - engineering geology
      - geohazards
      - geological risk
      - инженерно-геологические изыскания
      - оползни
      - карст
      - просадочность
    subtopics:
      - site investigation
      - geological hazards
      - landslide susceptibility
      - karst and subsidence
      - permafrost engineering
      - urban geology

  - id: geotechnical_monitoring
    name: Геотехнический мониторинг
    weight: 1.0
    description: Наблюдение за деформациями, нагрузками и состоянием сооружений.
    terms:
