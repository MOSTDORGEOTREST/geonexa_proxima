cross_cutting_priorities:
  - id: reproducibility
    name: Воспроизводимость и открытая наука
    weight: 1.0
    terms: [open source, open data, reproducible research, benchmark]
  - id: field_validation
    name: Натурная и промышленная валидация
    weight: 1.0
    terms: [field study, case study, real-world deployment, production]
  - id: data_quality
    name: Качество и происхождение данных
    weight: 0.9
    terms: [data quality, provenance, label quality, data leakage]
  - id: operational_readiness
    name: Готовность к инженерному применению
    weight: 0.9
    terms: [latency, robustness, scalability, deployment, MLOps]

ranking:
  score_range: [0, 10]
  weights:
    relevance: 0.30
    novelty: 0.20
    scientific_quality: 0.15
    practical_value: 0.20
    importance_for_ai: 0.15
  deep_analysis_prompts:
    - В чём научная новизна относительно сильных baseline?
    - Какие данные использованы и есть ли риск утечки?
    - Согласуются ли выводы с физикой процесса?
    - Каковы ограничения и область применимости?
    - Как перенести метод в геотехническую практику?
    - Доступны ли код, веса и датасет?
