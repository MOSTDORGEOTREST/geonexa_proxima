# =============================================================================
# GeoNexa Proxima — глобальный harvest-профиль (scope сбора)
# =============================================================================
# Это НЕ профиль интересов пользователя. Это единственный ответ на вопрос
# «что мы вообще тянем из внешнего мира», общий для всей платформы.
#
# Зачем: без него collectors качают весь arXiv/OpenAlex/Crossref. Профиль задаёт
# (а) какие запросы отправлять в источники и (б) дешёвый детерминированный
# keyword-gate, который отсекает мусор ДО эмбеддингов и LLM.
#
# Источник истины в runtime — таблицы harvest_profiles / harvest_term_groups /
# harvest_terms / harvest_queries в PostgreSQL. Этот файл — seed и формат
# экспорта:
#   poetry run geonexa harvest seed   --file config/harvest.yaml   # YAML -> БД
#   poetry run geonexa harvest export --file config/harvest.yaml   # БД -> YAML
# Правки в админке меняют БД; export возвращает их в git.
#
# Матчинг: по нормализованному тексту (lower, схлопнутые пробелы, дефисы -> ' ').
#   match: phrase — подстрока с границами слова ("soil mechanics")
#   match: token  — отдельный токен ("PINN", "InSAR")
#   match: regex  — python re, при необходимости
#   match: prefix — начало слова ("liquefac" -> liquefaction / liquefiable)
# =============================================================================

version: 2
schema: harvest_profile

profile:
  key: geo_ai_core
  name: "Инженерная геология, геотехника и AI/ML"
  description: >-
    Базовый scope платформы: работы, методы, ПО и датасеты на пересечении
    инженерной геологии / геотехники и машинного обучения, физически
    информированного моделирования и приборного/дистанционного мониторинга.
  is_active: true
  languages: [en, ru]
  item_kinds: [paper, method, software, dataset]

  # ---------------------------------------------------------------------------
  # Главное правило. Булево выражение над id групп ниже.
  # Поддерживается: and / or / not / скобки.
  #
  # Текущее: обязателен геотехнический якорь И (метод AI/ML ИЛИ инструментальный
  # /дистанционный сигнал), при отсутствии жёстких стоп-слов.
  #
  # Хочешь только AI-работы  -> "geo_domain and ai_method and not hard_exclude"
  # Хочешь всю геотехнику    -> "geo_domain and not hard_exclude"
  # Хочешь пару обязательных -> заполни группу must_have (mode: all_of) и
  #                             добавь её в выражение через and.
  # ---------------------------------------------------------------------------
  satisfy: "geo_domain and (ai_method or geo_sensing) and not hard_exclude"

  # Порог keyword_score для стадии 1. Элементы ниже порога, но прошедшие
  # satisfy, помечаются borderline и добираются семантическим гейтом.
  keyword_score_threshold: 0.35
  borderline_semantic_threshold: 0.52

# =============================================================================
# ГРУППЫ ТЕРМИНОВ
# =============================================================================
# mode: any_of  — достаточно min_matches попаданий
# mode: all_of  — нужны все термины группы
# mode: none_of — ни одного (стоп-лист)
# fields        — где ищем: title | abstract | keywords | venue | authors_affil
# weight        — вклад группы в keyword_score
# hard          — true: срабатывание блокирует безусловно (только для none_of)
# =============================================================================

groups:

  # ---------------------------------------------------------------------------
  - id: must_have
    name: "Обязательные слова (пусто по умолчанию)"
    mode: all_of
    min_matches: 0
    fields: [title, abstract, keywords]
    weight: 0.0
    enabled: false
    comment: >-
      Резерв под требование «пара слов должна быть обязательно». Например,
      terms: [{term: soil, match: prefix}] заставит требовать грунт в каждом
      материале. Включается флагом enabled и добавлением в satisfy.
    terms: []

