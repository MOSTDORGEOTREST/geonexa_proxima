      - {term: "геотермальн",                  match: prefix, lang: ru, weight: 0.5}

  # ---------------------------------------------------------------------------
  - id: pure_geology
    name: "Признаки чистой геологии (режут только без инженерного якоря)"
    mode: none_of
    hard: false
    penalty: 0.0
    fields: [title, abstract, keywords]
    weight: 0.0
    comment: >-
      Участвует в satisfy как «geo_broad and not pure_geology»: общегеологическая
      статья без инженерного или строительного якоря отклоняется. Сама по себе
      группа ничего не блокирует и штрафа не даёт.
    terms:
      - {term: "paleontolog",                  match: prefix}
      - {term: "palaeontolog",                 match: prefix}
      - {term: "fossil",                       match: prefix}
      - {term: "biostratigraph",               match: prefix}
      - {term: "chronostratigraph",            match: prefix}
      - {term: "lithostratigraph",             match: prefix}
      - {term: "stratigraphic sequence",       match: phrase}
      - {term: "sequence stratigraphy",        match: phrase}
      - {term: "paleoclimat",                  match: prefix}
      - {term: "palaeoclimat",                 match: prefix}
      - {term: "paleoenvironment",             match: prefix}
      - {term: "paleogeograph",                match: prefix}
      - {term: "geochronolog",                 match: prefix}
      - {term: "isotope geochemistry",         match: phrase}
      - {term: "zircon",                       match: prefix}
      - {term: "petrogenesis",                 match: prefix}
      - {term: "petrolog",                     match: prefix}
      - {term: "magmati",                      match: prefix}
      - {term: "igneous",                      match: prefix}
      - {term: "metamorphi",                   match: prefix}
      - {term: "volcanolog",                   match: prefix}
      - {term: "volcanic eruption",            match: phrase}
      - {term: "plate tectonic",               match: phrase}
      - {term: "mantle",                       match: token}
      - {term: "subduction",                   match: prefix}
      - {term: "orogen",                       match: prefix}
      - {term: "ore deposit",                  match: phrase}
      - {term: "ore genesis",                  match: phrase}
      - {term: "mineral deposit",              match: phrase}
      - {term: "mineral exploration",          match: phrase}
      - {term: "metallogen",                   match: prefix}
      - {term: "hydrocarbon exploration",      match: phrase}
      - {term: "petroleum system",             match: phrase}
      - {term: "source rock",                  match: phrase}
      - {term: "planetary geolog",             match: prefix}
      - {term: "meteorite",                    match: prefix}
      - {term: "dinosaur",                     match: prefix}
      # --- русский ----------------------------------------------------------------
      - {term: "палеонтолог",                  match: prefix, lang: ru}
      - {term: "ископаем",                     match: prefix, lang: ru}
      - {term: "биостратиграф",                match: prefix, lang: ru}
      - {term: "стратиграфи",                  match: prefix, lang: ru}
      - {term: "палеоклимат",                  match: prefix, lang: ru}
      - {term: "палеогеограф",                 match: prefix, lang: ru}
      - {term: "геохронолог",                  match: prefix, lang: ru}
      - {term: "петролог",                     match: prefix, lang: ru}
      - {term: "петрогенез",                   match: prefix, lang: ru}
      - {term: "магматическ",                  match: prefix, lang: ru}
      - {term: "метаморфи",                    match: prefix, lang: ru}
      - {term: "вулкан",                       match: prefix, lang: ru}
      - {term: "тектоник плит",                match: phrase, lang: ru}
      - {term: "рудн",                         match: prefix, lang: ru}
      - {term: "месторожден",                  match: prefix, lang: ru}
      - {term: "металлоген",                   match: prefix, lang: ru}
      - {term: "нефтегазоносн",                match: prefix, lang: ru}
      - {term: "минералог",                    match: prefix, lang: ru}

  # ---------------------------------------------------------------------------
  - id: quality_signal
    name: "Сигналы качества (не участвуют в satisfy, только в score)"
    mode: any_of
    min_matches: 1
    fields: [title, abstract, keywords]
    weight: 0.15
    affects_satisfy: false
    terms:
      - {term: "open source",                  match: phrase, weight: 1.0}
      - {term: "open-source",                  match: phrase, weight: 1.0}
      - {term: "publicly available",           match: phrase, weight: 0.9}
      - {term: "code is available",            match: phrase, weight: 1.0}
      - {term: "we release",                   match: phrase, weight: 0.9}
      - {term: "reproducib",                   match: prefix, weight: 0.9}
      - {term: "benchmark",                    match: prefix, weight: 0.8}
      - {term: "field data",                   match: phrase, weight: 1.0}
      - {term: "field validation",             match: phrase, weight: 1.0}
      - {term: "case study",                   match: phrase, weight: 0.7}
      - {term: "in situ measurement",          match: phrase, weight: 0.9}
      - {term: "full-scale test",              match: phrase, weight: 1.0}
      - {term: "centrifuge test",              match: phrase, weight: 0.9}
      - {term: "real-world deployment",        match: phrase, weight: 1.0}
      - {term: "ablation study",               match: phrase, weight: 0.7}
      - {term: "cross-validation",             match: phrase, weight: 0.5}
      - {term: "dataset of",                   match: phrase, weight: 0.7}

  # ---------------------------------------------------------------------------
  - id: hard_exclude
    name: "Жёсткие стоп-слова (блокируют безусловно)"
    mode: none_of
    hard: true
    fields: [title]
    weight: 0.0
    comment: >-
      Только title и только однозначные случаи: в abstract эти слова часто
      встречаются в валидных геотехнических работах.
    terms:
      - {term: "soil microbiome",              match: phrase}
      - {term: "soil microbial",               match: phrase}
      - {term: "soil fertility",               match: phrase}
      - {term: "crop yield",                   match: phrase}
      - {term: "crop growth",                  match: phrase}
      - {term: "agronom",                      match: prefix}
      - {term: "fertilizer",                   match: prefix}
      - {term: "soil organic carbon sequestration", match: phrase}
      - {term: "phytoremediation",             match: prefix}
      - {term: "protein folding",              match: phrase}
      - {term: "drug discovery",               match: phrase}
      - {term: "cancer",                       match: prefix}
      - {term: "electroencephalo",             match: prefix}
      - {term: "stock market",                 match: phrase}
      - {term: "cryptocurrenc",                match: prefix}
      - {term: "blockchain",                   match: prefix}
      - {term: "recommender system",           match: phrase}
      - {term: "sentiment analysis",           match: phrase}
      - {term: "geopolitic",                   match: prefix}
      - {term: "battery electrode",            match: phrase}
      - {term: "photovoltaic cell",            match: phrase}
      - {term: "bibliometric",                 match: prefix}
      - {term: "scientometric",                match: prefix}
      - {term: "editorial",                    match: token}
      - {term: "erratum",                      match: token}
      - {term: "corrigendum",                  match: token}
      - {term: "retracted",                    match: prefix}

  # ---------------------------------------------------------------------------
  - id: soft_exclude
    name: "Мягкие стоп-слова (штраф к keyword_score)"
    mode: none_of
    hard: false
    penalty: 0.25
    fields: [title, abstract]
    terms:
      - {term: "planetary soil",               match: phrase}
      - {term: "lunar regolith",               match: phrase}
      - {term: "martian",                      match: prefix}
      - {term: "asteroid",                     match: prefix}
      - {term: "food security",                match: phrase}
      - {term: "precision agriculture",        match: phrase}
      - {term: "review of literature",         match: phrase}

# =============================================================================
# ЗАПРОСЫ К ИСТОЧНИКАМ
# =============================================================================
# Генерация: {geo} и {ai} подставляются как OR-скобки топ-N терминов группы
# (по weight), с учётом синтаксиса конкретного провайдера. Явный query
# перекрывает шаблон. enabled/priority/max_items редактируются в админке.
# =============================================================================

sources:

  # Запросы каждого источника пишутся в его синтаксисе и уходят по одному:
  # склеенная через OR строка у нечётких поисков (Crossref, OpenAlex) находит
  # меньше, чем каждое условие по отдельности. Русские запросы — обязательны:
  # OpenAlex и Crossref индексируют российские журналы с русскими заголовками.

  arxiv:
    enabled: true
    max_items_per_run: 300
    lookback_hours: 192          # arXiv не даёт фильтр по дате в API — режем сами
    categories: [cs.LG, cs.CV, cs.AI, physics.geo-ph, stat.ML, math.NA, cs.CE, eess.SP]
    queries:
      - {id: ax_geo_ai,     enabled: true, priority: 10, query: 'abs:"geotechnical" AND (abs:"machine learning" OR abs:"neural" OR abs:"deep learning")'}
      - {id: ax_geotech,    enabled: true, priority: 10, query: 'abs:"geotechnical" OR abs:"soil mechanics" OR abs:"engineering geology" OR abs:"geomechanics"'}
      - {id: ax_soil_ml,    enabled: true, priority: 10, query: '(abs:"soil mechanics" OR abs:"soil behaviour" OR abs:"granular material") AND (abs:"machine learning" OR abs:"neural operator" OR abs:"physics-informed")'}
      - {id: ax_slope,      enabled: true, priority: 9,  query: 'abs:"landslide" OR abs:"slope stability" OR abs:"rockfall" OR abs:"debris flow"'}
      - {id: ax_liq,        enabled: true, priority: 9,  query: 'abs:"liquefaction" OR (abs:"cyclic loading" AND abs:"soil")'}
      - {id: ax_pinn_geo,   enabled: true, priority: 9,  query: '(abs:"physics-informed" OR abs:"neural operator" OR abs:"differentiable simulation") AND (abs:"porous" OR abs:"geomechanics" OR abs:"subsurface" OR abs:"soil")'}
      - {id: ax_subsurface, enabled: true, priority: 8,  query: '(abs:"subsurface" OR abs:"borehole" OR abs:"site investigation") AND (abs:"machine learning" OR abs:"generative" OR abs:"foundation model")'}
      - {id: ax_insar,      enabled: true, priority: 8,  query: '(abs:"InSAR" OR abs:"ground deformation" OR abs:"subsidence") AND (abs:"deep learning" OR abs:"time series")'}
      - {id: ax_tunnel,     enabled: true, priority: 8,  query: 'abs:"tunnel" OR abs:"tunnelling" OR abs:"TBM" OR abs:"deep excavation"'}
      - {id: ax_found,      enabled: true, priority: 8,  query: 'abs:"pile foundation" OR abs:"shallow foundation" OR abs:"bearing capacity" OR abs:"retaining wall"'}
      - {id: ax_dem,        enabled: true, priority: 7,  query: '(abs:"discrete element method" OR abs:"granular flow") AND (abs:"graph neural network" OR abs:"learned simulator" OR abs:"surrogate")'}
      - {id: ax_uq_geo,     enabled: true, priority: 7,  query: '(abs:"uncertainty quantification" OR abs:"bayesian") AND (abs:"geotechnical" OR abs:"slope" OR abs:"foundation" OR abs:"soil")'}
      - {id: ax_civil,      enabled: true, priority: 6,  query: '(abs:"civil engineering" OR abs:"structural health monitoring" OR abs:"construction") AND (abs:"machine learning" OR abs:"deep learning" OR abs:"digital twin")'}
      - {id: ax_permafrost, enabled: true, priority: 6,  query: 'abs:"permafrost" OR abs:"frozen soil" OR abs:"frost heave"'}
      - {id: ax_dam,        enabled: true, priority: 6,  query: 'abs:"embankment dam" OR abs:"tailings dam" OR abs:"levee" OR abs:"earth dam"'}

  openalex:
    enabled: true
    max_items_per_run: 400
    lookback_hours: 192
    # concepts/topics используются как дополнительный фильтр к полнотекстовому поиску
    concepts: ["Geotechnical engineering", "Engineering geology", "Soil science", "Remote sensing", "Machine learning"]
    queries:
      - {id: oa_geotech,  enabled: true, priority: 10, query: 'geotechnical engineering'}
      - {id: oa_soilmech, enabled: true, priority: 10, query: 'soil mechanics'}
      - {id: oa_enggeo,   enabled: true, priority: 10, query: 'engineering geology'}
      - {id: oa_geo_ai,   enabled: true, priority: 10, query: 'geotechnical machine learning'}
      - {id: oa_found,    enabled: true, priority: 9,  query: 'pile foundation settlement bearing capacity'}
      - {id: oa_hazard,   enabled: true, priority: 9,  query: 'landslide slope stability liquefaction subsidence'}
      - {id: oa_pinn,     enabled: true, priority: 9,  query: 'physics-informed neural network geomechanics porous media'}
      - {id: oa_tunnel,   enabled: true, priority: 9,  query: 'tunnelling deep excavation retaining structure'}
      - {id: oa_monitor,  enabled: true, priority: 8,  query: 'geotechnical monitoring structural health monitoring deformation'}
      - {id: oa_site,     enabled: true, priority: 8,  query: 'site investigation cone penetration test borehole'}
      - {id: oa_rock,     enabled: true, priority: 8,  query: 'rock mechanics rock mass tunnel mining'}
      - {id: oa_dam,      enabled: true, priority: 8,  query: 'embankment dam tailings dam levee seepage'}
      - {id: oa_perma,    enabled: true, priority: 8,  query: 'permafrost frozen soil thaw settlement'}
      - {id: oa_road,     enabled: true, priority: 7,  query: 'roadbed subgrade pavement railway embankment'}
      - {id: oa_civil_ai, enabled: true, priority: 7,  query: 'civil engineering construction deep learning'}
      - {id: oa_dt,       enabled: true, priority: 7,  query: 'digital twin geotechnical tunnel dam foundation'}
      - {id: oa_unsat,    enabled: true, priority: 7,  query: 'unsaturated soil constitutive model'}
      - {id: oa_hydro,    enabled: true, priority: 6,  query: 'hydrogeology groundwater engineering geology'}
      # --- русские: OpenAlex индексирует российские журналы с русскими заголовками
      - {id: oa_ru_geo,   enabled: true, priority: 10, query: 'инженерная геология геотехника'}
      - {id: oa_ru_soil,  enabled: true, priority: 10, query: 'механика грунтов основания фундаменты'}
      - {id: oa_ru_ai,    enabled: true, priority: 9,  query: 'грунты машинное обучение нейронные сети'}
      - {id: oa_ru_haz,   enabled: true, priority: 9,  query: 'оползни устойчивость склонов разжижение грунтов'}
      - {id: oa_ru_izysk, enabled: true, priority: 9,  query: 'инженерно-геологические изыскания статическое зондирование'}
      - {id: oa_ru_str,   enabled: true, priority: 8,  query: 'строительство фундаментов котлован подземные сооружения'}
      - {id: oa_ru_perma, enabled: true, priority: 8,  query: 'многолетнемёрзлые грунты геокриология'}
      - {id: oa_ru_road,  enabled: true, priority: 7,  query: 'земляное полотно насыпь автомобильные дороги грунт'}
      - {id: oa_ru_hydro, enabled: true, priority: 7,  query: 'гидротехнические сооружения плотина дамба грунт'}
      - {id: oa_ru_tun,   enabled: true, priority: 7,  query: 'тоннель метрополитен горные выработки'}

  crossref:
    enabled: true
    max_items_per_run: 300
    lookback_hours: 192
    filters:
      type: ["journal-article", "proceedings-article", "posted-content"]
      has_abstract: true
    # Приоритетные журналы: их выдача проходит с пониженным порогом keyword_score
    priority_containers:
      - "Geotechnique"
      - "Canadian Geotechnical Journal"
      - "Journal of Geotechnical and Geoenvironmental Engineering"
      - "Computers and Geotechnics"
      - "Acta Geotechnica"
      - "Engineering Geology"
      - "Bulletin of Engineering Geology and the Environment"
      - "Landslides"
      - "Soils and Foundations"
      - "Georisk"
      - "Tunnelling and Underground Space Technology"
      - "International Journal of Rock Mechanics and Mining Sciences"
      - "Rock Mechanics and Rock Engineering"
      - "Journal of Rock Mechanics and Geotechnical Engineering"
      - "Computers & Geosciences"
      - "Geoscience Frontiers"
    # Журналы целиком, по ISSN: не поиск, а всё, что вышло в журнале за окно.
    # Так подключаются российские издания, у которых в Crossref только
    # заголовок и авторы — по словам они не находятся. Дописывайте свои:
    # ISSN печатной или электронной версии, любой из двух.
    issns:
      # --- российские и переводные ---
      - "0038-0741"   # Soil Mechanics and Foundation Engineering (перевод ОФМГ, Springer)
      - "1573-9279"   # Soil Mechanics and Foundation Engineering (electronic)
      - "0869-7809"   # Геоэкология. Инженерная геология, гидрогеология, геокриология (РАН)
      - "3034-6401"   # Геоэкология / Environmental Geoscience (Наука)
      - "1997-0935"   # Вестник МГСУ
      - "2304-6600"   # Вестник МГСУ (electronic)
      - "2411-3336"   # Записки Горного института
      - "2541-9404"   # Записки Горного института (electronic)
      - "1062-7391"   # Journal of Mining Science (перевод ФТПРПИ)
      # --- международные геотехнические ---
      - "0016-8505"   # Géotechnique
      - "0008-3674"   # Canadian Geotechnical Journal
      - "0266-352X"   # Computers and Geotechnics
      - "1861-1125"   # Acta Geotechnica
      - "0013-7952"   # Engineering Geology
      - "1612-510X"   # Landslides
      - "0038-0806"   # Soils and Foundations
      - "1090-0241"   # J. Geotechnical and Geoenvironmental Engineering
      - "0886-7798"   # Tunnelling and Underground Space Technology
      - "1365-1609"   # Int. J. Rock Mechanics and Mining Sciences
      - "0723-2632"   # Rock Mechanics and Rock Engineering
      - "1674-7755"   # J. Rock Mechanics and Geotechnical Engineering
      - "1435-9529"   # Bulletin of Engineering Geology and the Environment
      - "0266-1144"   # Geotextiles and Geomembranes
      - "0267-7261"   # Soil Dynamics and Earthquake Engineering
    queries:
      - {id: cr_geo_ai,  enabled: true, priority: 10, query: 'geotechnical machine learning'}
      - {id: cr_geotech, enabled: true, priority: 10, query: 'geotechnical engineering soil'}
      - {id: cr_geo_dl,  enabled: true, priority: 9,  query: 'engineering geology deep learning'}
      - {id: cr_pinn,    enabled: true, priority: 9,  query: 'physics-informed neural network soil'}
      - {id: cr_ls,      enabled: true, priority: 8,  query: 'landslide susceptibility deep learning'}
      - {id: cr_cpt,     enabled: true, priority: 8,  query: 'cone penetration test machine learning'}
      - {id: cr_found,   enabled: true, priority: 8,  query: 'pile foundation settlement prediction'}
      - {id: cr_tunnel,  enabled: true, priority: 8,  query: 'tunnel excavation ground settlement'}
      - {id: cr_civil,   enabled: true, priority: 7,  query: 'civil engineering construction machine learning'}
      - {id: cr_perma,   enabled: true, priority: 7,  query: 'permafrost engineering frozen soil'}
      # --- русские: библиографический поиск Crossref понимает кириллицу
      - {id: cr_ru_geo,  enabled: true, priority: 10, query: 'инженерная геология геотехника'}
      - {id: cr_ru_soil, enabled: true, priority: 10, query: 'механика грунтов фундаменты'}
      - {id: cr_ru_ai,   enabled: true, priority: 9,  query: 'грунты нейронные сети машинное обучение'}
      - {id: cr_ru_haz,  enabled: true, priority: 9,  query: 'оползни склоны разжижение'}
      - {id: cr_ru_str,  enabled: true, priority: 8,  query: 'строительство котлован подземное сооружение'}
      - {id: cr_ru_izysk, enabled: true, priority: 8, query: 'инженерные изыскания зондирование'}
      - {id: cr_ru_perma, enabled: true, priority: 8, query: 'мерзлые грунты геокриология'}
      - {id: cr_ru_road, enabled: true, priority: 7,  query: 'земляное полотно дорожное строительство'}

  semantic_scholar:
    enabled: true
    role: enricher                # обогащение citations/tldr/references, не первичный сбор
    max_items_per_run: 500

  github:
    enabled: true
    max_items_per_run: 100
    lookback_hours: 336
    filters:
      min_stars: 5
      pushed_within_days: 400
      exclude_forks: true
      exclude_archived: true
    queries:
      - {id: gh_geotech_ml, enabled: true, priority: 10, query: 'geotechnical machine learning in:name,description,readme'}
      - {id: gh_geotech,    enabled: true, priority: 10, query: 'geotechnical'}
      - {id: gh_soil,       enabled: true, priority: 9,  query: 'soil mechanics'}
      - {id: gh_pinn_geo,   enabled: true, priority: 9,  query: 'physics-informed neural network porous OR geomechanics'}
      - {id: gh_landslide,  enabled: true, priority: 9,  query: 'landslide susceptibility model'}
      - {id: gh_cpt,        enabled: true, priority: 8,  query: 'cone penetration test soil classification'}
      - {id: gh_insar,      enabled: true, priority: 8,  query: 'InSAR time series deformation'}
      - {id: gh_fem_diff,   enabled: true, priority: 7,  query: 'differentiable finite element simulation'}
      - {id: gh_dem,        enabled: true, priority: 7,  query: 'discrete element method granular simulation'}
      - {id: gh_found,      enabled: true, priority: 7,  query: 'pile foundation OR slope stability'}
      - {id: gh_ru,         enabled: true, priority: 6,  query: 'геотехника OR грунт OR фундамент'}

  # --- КиберЛенинка: российская открытая библиотека, протокол OAI-PMH -------
  # Поиска по словам у протокола нет: забираем всё, что появилось за окно,
  # постранично, а отсев делает гейт (русские термины в группах выше).
  # Наборы (sets) сужают выдачу до рубрик — их список отдаёт
  #   https://cyberleninka.ru/oai?verb=ListSets
  # Пустой список — вся библиотека, поэтому есть потолок страниц (по 100
  # записей). У сайта есть антибот: если вместо XML приходит капча, источник
  # так и напишет в отчёте прогона — тогда нужен другой адрес выхода или пауза.
  cyberleninka:
    enabled: true
    base_url: "https://cyberleninka.ru/oai"
    sets: []
    max_pages: 30

  # --- Любой журнал на OJS / Elpub по OAI-PMH ---------------------------------
  # Адрес обычно вида https://журнал.ru/index.php/имя/oai или https://журнал.ru/oai.
  # Проверить: <адрес>?verb=Identify должен отдать XML. Включайте по одному.
  oai:
    enabled: false
    max_pages: 10
    endpoints:
      - {enabled: false, base_url: "https://ofmg.ru/oai", comment: "Основания, фундаменты и механика грунтов — проверить адрес"}
      - {enabled: false, base_url: "https://vestnikmgsu.ru/index.php/journal/oai", comment: "Вестник МГСУ — проверить адрес"}
      - {enabled: false, base_url: "https://pmi.spmi.ru/index.php/pmi/oai", comment: "Записки Горного института — проверить адрес"}

  huggingface:
    enabled: false                # включить после появления профильных датасетов
    max_items_per_run: 50
    queries:
      - {id: hf_geo, enabled: true, priority: 5, query: 'geotechnical OR borehole OR landslide OR subsurface'}

# =============================================================================
# ВОРОНКА
# =============================================================================
funnel:
  stage_1_keyword_gate:
    description: "Детерминированный матчинг satisfy + keyword_score. Без сети и LLM."
    outcomes: [accepted, borderline, rejected]
  stage_2_semantic_gate:
    description: "Эмбеддинг материала vs эмбеддинг harvest-профиля. Спасает borderline."
    threshold_ref: profile.borderline_semantic_threshold
  stage_3_global_llm_score:
    description: "Light LLM даёт глобальную научную оценку RankResult. Только для прошедших 1-2."
    model_role: ranker
  stage_4_deep_analysis:
    description: "Heavy LLM разбирает материал. Только выше deep_analysis_threshold."
    model_role: analyzer
  stage_5_personalization:
    description: "Отдельный флоу на подписчика: semantic + reranker + global + interests."
