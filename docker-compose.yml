# Production-стек Проксимы.
#
# Отличия от docker-compose.dev.yml:
#   * база внешняя (управляемый PostgreSQL) — контейнера postgres здесь нет;
#   * TLS до базы обязателен, режим и корневой сертификат задаются в .env;
#   * рассылка настоящая: DELIVERY_DRY_RUN по умолчанию выключен;
#   * наружу торчит только админка; API и Prefect живут во внутренней сети.
#
#   docker compose up -d --build
#   docker compose logs -f api
#
# Перед первым запуском: cp .env.example .env и заполнить секреты.
# Схему создавать руками не нужно — сервис поднимет её сам (DB_AUTO_MIGRATE).

name: geonexa-proxima

x-app-env: &app-env
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  TIMEZONE: ${TIMEZONE:-Europe/Moscow}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Задай PUBLIC_BASE_URL — из него собирается вебхук}

  DATABASE_URL: ${DATABASE_URL:?Задай DATABASE_URL}
  DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
  DATABASE_SSL_ROOT_CERT: ${DATABASE_SSL_ROOT_CERT:-/app/certs/root.crt}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
  DB_CONNECTION_BUDGET: ${DB_CONNECTION_BUDGET:-2}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-15}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
  DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-30}
  DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
  DB_AUTO_SEED: ${DB_AUTO_SEED:-true}

  VECTOR_BACKEND: pgvector
  VECTOR_COLUMN_TYPE: ${VECTOR_COLUMN_TYPE:-vector}
  VECTOR_INDEX_KIND: ${VECTOR_INDEX_KIND:-hnsw}
  MODELS_ROOT: /app/models
  EMBEDDING_MODE: ${EMBEDDING_MODE:-local}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  RERANKER_MODE: ${RERANKER_MODE:-local}

  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-geonexa-pool}

  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Задай TELEGRAM_BOT_TOKEN}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_OWNER_IDS: ${TELEGRAM_OWNER_IDS:-}
  TELEGRAM_REGISTRATION_MODE: ${TELEGRAM_REGISTRATION_MODE:-allowlist}
  TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
  TELEGRAM_ALLOW_GROUP_CHATS: ${TELEGRAM_ALLOW_GROUP_CHATS:-true}
  TELEGRAM_AUTO_REGISTER_CHATS: ${TELEGRAM_AUTO_REGISTER_CHATS:-true}
  DELIVERY_DRY_RUN: ${DELIVERY_DRY_RUN:-false}

  LIGHT_LLM_BASE_URL: ${LIGHT_LLM_BASE_URL:-https://api.deepseek.com/v1}
  LIGHT_LLM_MODEL: ${LIGHT_LLM_MODEL:-deepseek-v4-flash}
  LIGHT_LLM_API_KEY: ${LIGHT_LLM_API_KEY:-}
  HEAVY_LLM_BASE_URL: ${HEAVY_LLM_BASE_URL:-https://api.deepseek.com/v1}
  HEAVY_LLM_MODEL: ${HEAVY_LLM_MODEL:-deepseek-v4-flash}
  HEAVY_LLM_API_KEY: ${HEAVY_LLM_API_KEY:-}
  DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}

  ADMIN_USERNAME: ${ADMIN_USERNAME:?Задай ADMIN_USERNAME}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Задай ADMIN_JWT_SECRET}
  # ADMIN_PASSWORD_HASH намеренно НЕ перечислен здесь и приходит через env_file.
  # Значения в блоке environment проходят подстановку переменных, а argon2-хеш
  # состоит из долларов ($argon2id$v=19$m=…) — compose съел бы его по частям.
  # Отсутствие plaintext-пароля в production проверяет сам сервис на старте.

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # Веса не в образе: том только на чтение, чтобы контейнер их не переписал.
  volumes:
    - ./models:/app/models:ro
    - ./config:/app/config:ro
    - ${DATABASE_SSL_ROOT_CERT_HOST:-./certs}:/app/certs:ro
  env_file:
    - .env

services:
  # Метаданные Prefect. Управляемая база выдана одна, а Prefect требует свою.
  prefect-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PREFECT_POSTGRES_DB:-prefect}
      POSTGRES_USER: ${PREFECT_POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD:?Задай PREFECT_POSTGRES_PASSWORD}
    volumes:
      - prefect_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PREFECT_POSTGRES_USER:-prefect}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prefect-server:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PREFECT_POSTGRES_USER:-prefect}:${PREFECT_POSTGRES_PASSWORD}@prefect-postgres:5432/${PREFECT_POSTGRES_DB:-prefect}
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
    depends_on:
      prefect-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4200/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    <<: *app-build
    command: ["api"]
    environment:
      <<: *app-env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  bot:
    <<: *app-build
    command: ["bot"]
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy

  prefect-worker:
    <<: *app-build
    command: ["worker"]
    environment:
      <<: *app-env
    depends_on:
      api:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # ORIGIN обязателен: без него SvelteKit отвергает POST-формы как CSRF.
      ORIGIN: ${ADMIN_ORIGIN:?Задай ADMIN_ORIGIN — внешний адрес админки}
      API_INTERNAL_URL: http://api:8000
    ports:
      # Наружу торчит только админка; API и Prefect остаются внутри сети.
      - "${ADMIN_UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  prefect_postgres:
